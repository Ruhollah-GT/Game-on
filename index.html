
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAMEON</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;

  background:
    radial-gradient(circle at 50% 10%, #4b0000, #090909 45%, #020202 100%);
}

/* =========================
   TOPPEN
========================= */

header {
  width: 100%;
  padding: 25px 35px 10px;

  display: flex;
  justify-content: center;
}

/* GAMEON-BILDEN */

.gameon {
  width: min(850px, 92vw);
  height: auto;

  border-radius: 25px;

  box-shadow:
    0 0 30px rgba(255, 0, 0, .35),
    0 0 90px rgba(255, 0, 0, .15);

  animation: float 4s ease-in-out infinite;
}


/* =========================
   NAVIGATION
========================= */

nav {
  margin: 25px auto 0;

  width: fit-content;

  display: flex;
  gap: 10px;

  padding: 7px;

  border: 1px solid rgba(255,255,255,.12);

  border-radius: 18px;

  background: rgba(255,255,255,.07);

  backdrop-filter: blur(20px);

  box-shadow:
    0 10px 40px rgba(0,0,0,.35);
}

nav a {
  padding: 12px 28px;

  border-radius: 13px;

  color: #aaa;

  text-decoration: none;

  font-weight: bold;

  transition: .3s;
}

nav a:hover,
nav a.active {
  color: white;

  background: rgba(255,0,0,.22);

  box-shadow:
    0 0 20px rgba(255,0,0,.25);
}


/* =========================
   IKONER
========================= */

.icons {
  width: min(850px, 92vw);

  margin: 45px auto;

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 20px;
}

.icon-card {
  height: 150px;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 10px;

  border-radius: 25px;

  border: 1px solid rgba(255,255,255,.12);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.10),
      rgba(255,255,255,.03)
    );

  backdrop-filter: blur(20px);

  text-decoration: none;

  color: white;

  box-shadow:
    0 15px 40px rgba(0,0,0,.35);

  transition: .35s;
}

.icon-card:hover {
  transform:
    translateY(-10px)
    scale(1.05);

  border-color: rgba(255,0,0,.6);

  box-shadow:
    0 0 30px rgba(255,0,0,.35);
}

.icon {
  width: 65px;
  height: 65px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 20px;

  font-size: 32px;

  background:
    rgba(255,0,0,.16);

  box-shadow:
    inset 0 0 20px rgba(255,0,0,.12);
}

.icon-card span:last-child {
  font-size: 14px;
  font-weight: bold;
}


/* =========================
   ANIMATION
========================= */

@keyframes float {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-7px);
  }
}


/* =========================
   MOBIL
========================= */

@media (max-width: 650px) {

  header {
    padding: 18px 15px 5px;
  }

  .gameon {
    width: 96vw;
  }

  nav {
    margin-top: 18px;
  }

  nav a {
    padding: 10px 20px;
  }

  .icons {
    grid-template-columns:
      repeat(2, 1fr);

    width: 92vw;

    margin-top: 30px;
  }

  .icon-card {
    height: 135px;
  }
}
</style>
</head>


<body>

<!-- =========================
     GAMEON-BILD
========================= -->

<header>

  <img
    src="./gameon.png"
    class="gameon"
    alt="GAMEON">

</header>


<!-- =========================
     HOME / GAME
========================= -->

<nav>

  <a href="#" class="active">
    🏠 Home
  </a>

  <a href="#games">
    🎮 Game
  </a>

</nav>


<!-- =========================
     IKONER LÄNGST NER
========================= -->

<section class="icons" id="games">

  <a
    href="https://www.crazygames.com/"
    target="_blank"
    class="icon-card">

    <div class="icon">
      ⭐
    </div>

    <span>CrazyGames</span>

  </a>


  <a
    href="https://www.xbox.com/"
    target="_blank"
    class="icon-card">

    <div class="icon">
      🎮
    </div>

    <span>Xbox</span>

  </a>


  <a
    href="https://shellshock.io/"
    target="_blank"
    class="icon-card">

    <div class="icon">
      💥
    </div>

    <span>Shell Shockers</span>

  </a>


  <a
    href="#"
    class="icon-card"
    onclick="neonSpace()">

    <div class="icon">
      🚀
    </div>

    <span>Neon Space</span>

  </a>

</section>


<script>

function neonSpace() {
  alert("🚀 Neon Space kommer snart!");
}

</script>

</body>
</html>


<style>

body {
    background: #000;
}






.glow-on-hover {
    width: 220px;
    height: 50px;
    border: none;
    outline: none;
    color: #fff;
    background: #111;
    cursor: pointer;
    position: relative;
    z-index: 0;
    border-radius: 10px;
}

.glow-on-hover:before {
    content: '';
    background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
    position: absolute;
    top: -2px;
    left:-2px;
    background-size: 400%;
    z-index: -1;
    filter: blur(5px);
    width: calc(100% + 4px);
    height: calc(100% + 4px);
    animation: glowing 20s linear infinite;
    opacity: 0;
    transition: opacity .3s ease-in-out;
    border-radius: 10px;
}

.glow-on-hover:active {
    color: #000
}

.glow-on-hover:active:after {
    background: transparent;
}

.glow-on-hover:hover:before {
    opacity: 1;
}

.glow-on-hover:after {
    z-index: -1;
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: #111;
    left: 0;
    top: 0;
    border-radius: 10px;
}

@keyframes glowing {
    0% { background-position: 0 0; }
    50% { background-position: 400% 0; }
    100% { background-position: 0 0; }
}








</style>
