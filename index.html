
<!DOCTYPE html> <html lang="sv"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Game Menu</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; font-family: Arial, sans-serif; background: radial-gradient( circle at center, #350000, #080808 65% ); } /* ========================= GAME MENU ========================= */ .game-menu { position: relative; display: flex; flex-direction: column; align-items: center; } /* ========================= GAME BUTTON ========================= */ .game-button { position: relative; display: flex; align-items: center; justify-content: center; gap: 15px; padding: 20px 34px; border: 1px solid rgba(255,255,255,.25); border-radius: 20px; background: linear-gradient( 135deg, #650000, #ed0000, #720000 ); background-size: 200% 200%; color: white; font-size: 24px; font-weight: 900; letter-spacing: 4px; cursor: pointer; box-shadow: 0 0 15px red, 0 0 45px rgba(255,0,0,.45), inset 0 1px rgba(255,255,255,.25); animation: buttonGlow 3s ease infinite; transition: .35s; } .game-button:hover { transform: scale(1.1) translateY(-5px); box-shadow: 0 0 25px red, 0 0 80px rgba(255,0,0,.6); } .game-button:active { transform: scale(.95); } .play-arrow { font-size: 15px; transition: .3s; } .game-button:hover .play-arrow { transform: translateX(6px); } /* ========================= GAMES ========================= */ .games { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; opacity: 0; transform: translateY(-25px) scale(.8); pointer-events: none; transition: .45s cubic-bezier(.16,1,.3,1); } .games.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; } /* ========================= GAME OPTION ========================= */ .game-option { width: 310px; min-height: 70px; display: flex; align-items: center; gap: 14px; padding: 12px 16px; border: 1px solid rgba(255,255,255,.13); border-radius: 18px; background: rgba(25,25,25,.75); backdrop-filter: blur(20px); color: white; text-decoration: none; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,.4); transition: .3s; } .game-option:hover { transform: translateX(10px) scale(1.04); border-color: rgba(255,40,40,.8); box-shadow: 0 0 25px rgba(255,0,0,.4); } .game-icon { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; background: rgba(255,0,0,.15); font-size: 24px; transition: .3s; } .game-option:hover .game-icon { transform: rotate(-7deg) scale(1.15); } .game-text strong { display: block; font-size: 16px; } .game-text small { display: block; margin-top: 4px; color: #999; } .arrow { margin-left: auto; font-size: 21px; transition: .3s; } .game-option:hover .arrow { transform: translateX(5px); color: #ff3030; } /* ========================= PARTICLES ========================= */ .particles { position: absolute; inset: -170px; pointer-events: none; z-index: -1; } .particles i { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #ff3030; box-shadow: 0 0 10px red, 0 0 20px red; animation: floatParticle 5s infinite ease-in-out; } .particles i:nth-child(1) { left: 10%; top: 20%; } .particles i:nth-child(2) { left: 80%; top: 25%; width: 12px; height: 12px; } .particles i:nth-child(3) { left: 25%; top: 80%; animation-delay: 1s; } .particles i:nth-child(4) { left: 75%; top: 70%; animation-delay: 2s; } .particles i:nth-child(5) { left: 50%; top: 10%; animation-delay: 3s; } .particles i:nth-child(6) { left: 90%; top: 50%; animation-delay: 1.5s; } /* ========================= NEON SPACE WINDOW ========================= */ .neon-screen { position: fixed; inset: 0; z-index: 999; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,.75); backdrop-filter: blur(20px); opacity: 0; visibility: hidden; transition: .4s; } .neon-screen.active { opacity: 1; visibility: visible; } .neon-window { width: min(1000px,94vw); height: min(700px,88vh); overflow: hidden; border-radius: 28px; background: #030303; border: 1px solid rgba(255,255,255,.16); box-shadow: 0 40px 100px black, 0 0 70px rgba(255,0,0,.25); transform: scale(.75); transition: .5s cubic-bezier(.16,1,.3,1); } .neon-screen.active .neon-window { transform: scale(1); } /* HEADER */ .neon-header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; color: white; background: rgba(255,255,255,.06); border-bottom: 1px solid rgba(255,255,255,.1); } .neon-title { font-weight: bold; font-size: 18px; } .close-button { width: 38px; height: 38px; border: none; border-radius: 50%; background: rgba(255,255,255,.1); color: white; font-size: 25px; cursor: pointer; transition: .3s; } .close-button:hover { background: #e00000; transform: rotate(90deg); } /* GAME */ .neon-game { position: relative; height: calc(100% - 60px); } #neonCanvas { width: 100%; height: 100%; display: block; background: radial-gradient( circle, #180000, #010101 75% ); } /* START */ .neon-start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; } .neon-start h1 { font-size: 50px; margin: 15px 0 5px; text-shadow: 0 0 30px red; } .neon-start p { color: #888; } .start-button { margin-top: 20px; padding: 15px 38px; border: 1px solid red; border-radius: 14px; background: linear-gradient( 135deg, #650000, #e00000 ); color: white; font-weight: bold; cursor: pointer; box-shadow: 0 0 25px rgba(255,0,0,.4); transition: .3s; } .start-button:hover { transform: scale(1.08); box-shadow: 0 0 45px red; } /* SCORE */ .score { position: absolute; top: 15px; left: 20px; color: white; font-weight: bold; text-shadow: 0 0 15px red; } /* GAME OVER */ .game-over { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; background: rgba(0,0,0,.7); } .game-over h1 { color: red; font-size: 48px; text-shadow: 0 0 25px red; } /* ========================= ANIMATIONS ========================= */ @keyframes buttonGlow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } } @keyframes floatParticle { 0%,100% { transform: translateY(0) scale(1); opacity: .3; } 50% { transform: translateY(-45px) scale(1.5); opacity: 1; } } </style> </head> <body> <!-- ========================= MAIN GAME MENU ========================= --> <div class="game-menu"> <!-- PARTICLES --> <div class="particles"> <i></i> <i></i> <i></i> <i></i> <i></i> <i></i> </div> <!-- ⭐ GAME BUTTON ⭐ --> <button class="game-button" onclick="toggleGames()"> <span>🎮</span> <b>GAME</b> <span class="play-arrow"> ▶ </span> </button> <!-- ========================= GAME OPTIONS ========================= --> <div class="games" id="games"> <!-- CRAZY GAMES --> <a href="https://www.crazygames.com/" target="_blank" class="game-option"> <span class="game-icon"> ⭐ </span> <div class="game-text"> <strong> Crazy Games </strong> <small> Open CrazyGames </small> </div> <span class="arrow"> ↗ </span> </a> <!-- XBOX --> <a href="https://www.xbox.com/" target="_blank" class="game-option"> <span class="game-icon"> 🎮 </span> <div class="game-text"> <strong> Xbox </strong> <small> Open Xbox </small> </div> <span class="arrow"> ↗ </span> </a> <!-- SHELL SHOCKERS --> <a href="https://shellshock.io/" target="_blank" class="game-option"> <span class="game-icon"> 💥 </span> <div class="game-text"> <strong> Shell Shockers </strong> <small> Open Shell Shockers </small> </div> <span class="arrow"> ↗ </span> </a> <!-- NEON SPACE --> <button class="game-option" onclick="openNeonSpace()"> <span class="game-icon"> 🚀 </span> <div class="game-text"> <strong> Neon Space </strong> <small> Play inside your app </small> </div> <span class="arrow"> ▶ </span> </button> </div> </div> <!-- ========================= NEON SPACE ========================= --> <div class="neon-screen" id="neonScreen"> <div class="neon-window"> <div class="neon-header"> <div class="neon-title"> 🚀 Neon Space </div> <button class="close-button" onclick="closeNeonSpace()"> × </button> </div> <div class="neon-game"> <canvas id="neonCanvas"> </canvas> <div class="score"> SCORE: <span id="score"> 0 </span> </div> <!-- START --> <div class="neon-start" id="neonStart"> <div style="font-size:75px;"> 🚀 </div> <h1> NEON SPACE </h1> <p> WASD eller piltangenterna </p> <button class="start-button" onclick="startGame()"> ▶ START GAME </button> </div> <!-- GAME OVER --> <div class="game-over" id="gameOver"> <h1> GAME OVER </h1> <p> Score: <span id="finalScore"> 0 </span> </p> <button class="start-button" onclick="startGame()"> ↻ PLAY AGAIN </button> </div> </div> </div> </div> <script> /* ========================= GAME MENU ========================= */ function toggleGames() { document .getElementById("games") .classList.toggle("show"); } /* ========================= NEON SPACE OPEN ========================= */ function openNeonSpace() { document .getElementById("games") .classList.remove("show"); document .getElementById("neonScreen") .classList.add("active"); } /* ========================= CLOSE ========================= */ function closeNeonSpace() { document .getElementById("neonScreen") .classList.remove("active"); running = false; } /* ========================= CANVAS ========================= */ const canvas = document.getElementById( "neonCanvas" ); const ctx = canvas.getContext("2d"); let player; let enemies = []; let stars = []; let score = 0; let running = false; let animation; /* ========================= RESIZE ========================= */ function resizeCanvas() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; } window.addEventListener( "resize", resizeCanvas ); /* ========================= KEYBOARD ========================= */ const keys = {}; document.addEventListener( "keydown", e => { keys[ e.key.toLowerCase() ] = true; } ); document.addEventListener( "keyup", e => { keys[ e.key.toLowerCase() ] = false; } ); /* ========================= START GAME ========================= */ function startGame() { resizeCanvas(); player = { x: canvas.width / 2, y: canvas.height - 80, size: 20, speed: 7 }; enemies = []; stars = []; score = 0; running = true; document .getElementById("neonStart") .style.display = "none"; document .getElementById("gameOver") .style.display = "none"; for ( let i = 0; i < 100; i++ ) { stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, speed: 1 + Math.random() * 3 }); } gameLoop(); } /* ========================= CREATE ENEMY ========================= */ function createEnemy() { enemies.push({ x: Math.random() * canvas.width, y: -30, size: 12 + Math.random() * 14, speed: 2 + Math.random() * 3 }); } /* ========================= UPDATE ========================= */ function update() { /* MOVE */ if ( keys["a"] || keys["arrowleft"] ) { player.x -= player.speed; } if ( keys["d"] || keys["arrowright"] ) { player.x += player.speed; } if ( keys["w"] || keys["arrowup"] ) { player.y -= player.speed; } if ( keys["s"] || keys["arrowdown"] ) { player.y += player.speed; } /* BORDERS */ player.x = Math.max( 20, Math.min( canvas.width - 20, player.x ) ); player.y = Math.max( 20, Math.min( canvas.height - 20, player.y ) ); /* ENEMIES */ if ( Math.random() < .025 ) { createEnemy(); } enemies.forEach( enemy => { enemy.y += enemy.speed; } ); enemies = enemies.filter( enemy => enemy.y < canvas.height + 50 ); /* STARS */ stars.forEach( star => { star.y += star.speed; if ( star.y > canvas.height ) { star.y = 0; } } ); /* COLLISION */ for ( const enemy of enemies ) { const dx = player.x - enemy.x; const dy = player.y - enemy.y; const distance = Math.sqrt( dx * dx + dy * dy ); if ( distance < player.size + enemy.size ) { endGame(); return; } } /* SCORE */ score++; document .getElementById("score") .textContent = Math.floor( score / 10 ); } /* ========================= DRAW ========================= */ function draw() { ctx.clearRect( 0, 0, canvas.width, canvas.height ); /* STARS */ stars.forEach( star => { ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.fillRect( star.x, star.y, 2, 2 ); } ); /* PLAYER */ ctx.save(); ctx.translate( player.x, player.y ); ctx.shadowBlur = 30; ctx.shadowColor = "red"; ctx.fillStyle = "#ff3030"; ctx.beginPath(); ctx.moveTo( 0, -25 ); ctx.lineTo( 19, 20 ); ctx.lineTo( 0, 11 ); ctx.lineTo( -19, 20 ); ctx.closePath(); ctx.fill(); ctx.restore(); /* ENEMIES */ enemies.forEach( enemy => { ctx.save(); ctx.shadowBlur = 25; ctx.shadowColor = "red"; ctx.fillStyle = "#e00000"; ctx.beginPath(); ctx.arc( enemy.x, enemy.y, enemy.size, 0, Math.PI * 2 ); ctx.fill(); ctx.restore(); } ); } /* ========================= LOOP ========================= */ function gameLoop() { if (!running) return; update(); draw(); animation = requestAnimationFrame( gameLoop ); } /* ========================= GAME OVER ========================= */ function endGame() { running = false; document .getElementById( "finalScore" ) .textContent = Math.floor( score / 10 ); document .getElementById( "gameOver" ) .style.display = "flex"; } </script> </body> </html>




<style>

body {
    background: #000;
}






.glow-on-hover {
    width: 220px;
    height: 50px;
    border: none;
    outline: none;
    color: #fff;
    background: #111;
    cursor: pointer;
    position: relative;
    z-index: 0;
    border-radius: 10px;
}

.glow-on-hover:before {
    content: '';
    background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
    position: absolute;
    top: -2px;
    left:-2px;
    background-size: 400%;
    z-index: -1;
    filter: blur(5px);
    width: calc(100% + 4px);
    height: calc(100% + 4px);
    animation: glowing 20s linear infinite;
    opacity: 0;
    transition: opacity .3s ease-in-out;
    border-radius: 10px;
}

.glow-on-hover:active {
    color: #000
}

.glow-on-hover:active:after {
    background: transparent;
}

.glow-on-hover:hover:before {
    opacity: 1;
}

.glow-on-hover:after {
    z-index: -1;
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: #111;
    left: 0;
    top: 0;
    border-radius: 10px;
}

@keyframes glowing {
    0% { background-position: 0 0; }
    50% { background-position: 400% 0; }
    100% { background-position: 0 0; }
}








</style>
