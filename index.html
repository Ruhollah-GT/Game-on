

<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMEON</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  font-family: Arial, sans-serif;
  color: white;

  background:
    radial-gradient(circle at 50% 30%, #300000, #090909 60%, #020202);
}

/* =========================
   BUBBLOR
========================= */

.bubbles {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.bubbles i {
  position: absolute;
  border-radius: 50%;

  background: rgba(255, 0, 0, .12);

  border: 1px solid rgba(255, 60, 60, .35);

  box-shadow:
    0 0 15px rgba(255, 0, 0, .35);

  animation: floatBubble 7s infinite ease-in-out;
}

.bubbles i:nth-child(1) {
  width: 20px;
  height: 20px;
  left: 10%;
  top: 70%;
}

.bubbles i:nth-child(2) {
  width: 12px;
  height: 12px;
  left: 25%;
  top: 20%;
  animation-delay: 1s;
}

.bubbles i:nth-child(3) {
  width: 30px;
  height: 30px;
  right: 12%;
  top: 30%;
  animation-delay: 2s;
}

.bubbles i:nth-child(4) {
  width: 10px;
  height: 10px;
  right: 25%;
  bottom: 15%;
  animation-delay: 3s;
}

.bubbles i:nth-child(5) {
  width: 18px;
  height: 18px;
  left: 50%;
  bottom: 10%;
  animation-delay: 1.5s;
}

@keyframes floatBubble {
  0%,100% {
    transform: translateY(0) scale(1);
    opacity: .3;
  }

  50% {
    transform: translateY(-55px) scale(1.4);
    opacity: 1;
  }
}

/* =========================
   HUVUD
========================= */

.main {
  position: relative;
  z-index: 2;
}

/* =========================
   LOGGA
========================= */

.logo-container {
  display: flex;
  justify-content: center;
  padding-top: 30px;
}

.logo {
  padding: 20px 45px;

  border-radius: 23px;

  background:
    linear-gradient(
      135deg,
      #350000,
      #e00000,
      #580000,
      #b00000
    );

  background-size: 300% 300%;

  border: 1px solid #ff3030;

  box-shadow:
    0 0 15px #ff2020,
    0 0 40px rgba(255, 0, 0, .5),
    inset 0 0 25px rgba(255,255,255,.08);

  animation: logoGlow 4s ease infinite;
}

.logo-text {
  font-size: clamp(45px, 9vw, 80px);
  font-weight: 900;
  letter-spacing: 8px;

  text-shadow:
    0 0 8px white,
    0 0 20px red,
    0 0 45px red;
}

.logo-text span {
  color: #ff3030;
}

/* =========================
   NAV
========================= */

nav {
  width: fit-content;

  margin: 25px auto;

  padding: 7px;

  display: flex;
  gap: 8px;

  border-radius: 18px;

  background: rgba(255,255,255,.07);

  border: 1px solid rgba(255,255,255,.16);

  backdrop-filter: blur(20px);
}

nav button {
  border: none;

  padding: 13px 30px;

  border-radius: 13px;

  background: transparent;

  color: #999;

  font-weight: bold;

  cursor: pointer;

  transition: .3s;
}

nav button:hover,
nav button.active {
  color: white;

  background:
    rgba(255,0,0,.28);

  box-shadow:
    0 0 20px rgba(255,0,0,.35);
}

/* =========================
   HOME
========================= */

#welcome {
  width: min(900px,92vw);

  margin: 70px auto;

  text-align: center;
}

#welcome h1 {
  font-size: clamp(35px,7vw,65px);

  text-shadow:
    0 0 15px red,
    0 0 35px red;
}

#welcome p {
  color: #aaa;
  font-size: 18px;
}

/* =========================
   GAME MENY
========================= */

#gamePage {
  width: min(1000px,92vw);

  margin: 45px auto;

  display: none;
}

.game-title {
  text-align: center;

  font-size: 50px;

  text-shadow:
    0 0 15px red,
    0 0 35px red;
}

.games {
  display: grid;

  grid-template-columns:
    repeat(4,1fr);

  gap: 18px;
}

.game-card {
  min-height: 180px;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 14px;

  padding: 20px;

  border-radius: 22px;

  border: 1px solid rgba(255,50,50,.3);

  background:
    linear-gradient(
      145deg,
      rgba(80,0,0,.8),
      rgba(15,15,15,.9)
    );

  backdrop-filter: blur(20px);

  color: white;

  text-decoration: none;

  font-family: Arial,sans-serif;

  cursor: pointer;

  transition: .35s;
}

.game-card:hover {
  transform:
    translateY(-10px)
    scale(1.04);

  border-color: #ff3030;

  box-shadow:
    0 0 25px #ff2020,
    0 0 50px rgba(255,0,0,.4);
}

.icon {
  width: 70px;
  height: 70px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 20px;

  background:
    rgba(255,0,0,.17);

  font-size: 34px;
}

.game-name {
  font-weight: bold;
}

/* =========================
   NEON SPACE
========================= */

#neonSpace {
  display: none;

  width: min(1000px,94vw);

  margin: 30px auto;
}

.neon-box {
  padding: 25px;

  border-radius: 28px;

  background:
    radial-gradient(
      circle at 50% 40%,
      #300000,
      #0c0000 55%,
      #020202
    );

  border: 1px solid #ff3030;

  box-shadow:
    0 0 30px rgba(255,0,0,.5),
    inset 0 0 50px rgba(255,0,0,.12);
}

.neon-header {
  display: flex;

  align-items: center;
  justify-content: space-between;

  margin-bottom: 15px;
}

.neon-title {
  margin: 0;

  font-size: clamp(30px,6vw,50px);

  text-shadow:
    0 0 10px white,
    0 0 25px red,
    0 0 50px red;
}

.stats {
  display: flex;
  gap: 10px;
}

.stat {
  padding: 10px 14px;

  border-radius: 12px;

  background: rgba(255,0,0,.15);

  border: 1px solid rgba(255,50,50,.3);

  font-weight: bold;
}

#gameCanvas {
  display: block;

  width: 100%;
  height: 560px;

  border-radius: 20px;

  background: #020000;

  border: 1px solid rgba(255,40,40,.6);

  box-shadow:
    inset 0 0 40px rgba(255,0,0,.15);
}

.controls {
  text-align: center;

  margin-top: 12px;

  color: #999;

  font-size: 14px;
}

/* =========================
   BACK
========================= */

.back-button {
  display: block;

  margin: 18px auto 0;

  padding: 13px 27px;

  border: 1px solid #ff3030;

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      #650000,
      #e00000
    );

  color: white;

  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 0 18px rgba(255,0,0,.4);

  transition: .3s;
}

.back-button:hover {
  transform: scale(1.07);

  box-shadow:
    0 0 35px red;
}

/* =========================
   GAME OVER
========================= */

.game-over {
  position: absolute;

  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  flex-direction: column;

  background:
    rgba(0,0,0,.75);

  backdrop-filter: blur(8px);

  border-radius: 20px;
}

.game-over.show {
  display: flex;
}

.game-over h2 {
  margin: 0;

  font-size: 45px;

  color: #ff3030;

  text-shadow:
    0 0 15px red,
    0 0 40px red;
}

.game-over p {
  color: #ccc;
}

.restart {
  margin-top: 10px;

  padding: 12px 25px;

  border: none;

  border-radius: 13px;

  background: #d00000;

  color: white;

  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 0 20px red;
}

/* Canvas wrapper */

.canvas-wrapper {
  position: relative;
}

/* =========================
   ANIMATION
========================= */

@keyframes logoGlow {
  0%,100% {
    background-position: 0% 50%;
  }

  50% {
    background-position: 100% 50%;
  }
}

/* =========================
   MOBIL
========================= */

@media(max-width:750px) {

  .games {
    grid-template-columns:
      repeat(2,1fr);
  }

  .neon-box {
    padding: 15px;
  }

  #gameCanvas {
    height: 500px;
  }
}

@media(max-width:480px) {

  nav button {
    padding: 11px 20px;
  }

  .game-card {
    min-height: 145px;
  }

  .icon {
    width: 55px;
    height: 55px;
    font-size: 28px;
  }

  #gameCanvas {
    height: 430px;
  }

}
</style>
</head>

<body>

<!-- BUBBLOR -->

<div class="bubbles">
  <i></i>
  <i></i>
  <i></i>
  <i></i>
  <i></i>
</div>


<div class="main">

<!-- LOGGA -->

<div class="logo-container">

  <div class="logo">

    <div class="logo-text">
      GAME<span>ON</span>
    </div>

  </div>

</div>


<!-- NAV -->

<nav>

  <button
    id="homeButton"
    class="active"
    onclick="showHome()">

    🏠 Home

  </button>

  <button
    id="gameButton"
    onclick="showGames()">

    🎮 Game

  </button>

</nav>


<!-- HOME -->

<section id="welcome">

  <h1>
    Welcome to GAMEON
  </h1>

  <p>
    Your place for games, fun and awesome experiences.
  </p>

</section>


<!-- GAME MENY -->

<section id="gamePage">

  <h1 class="game-title">
    🎮 Games
  </h1>

  <div class="games">

    <a
      class="game-card"
      href="https://www.crazygames.com/"
      target="_blank"
      rel="noopener noreferrer">

      <div class="icon">⭐</div>

      <div class="game-name">
        CrazyGames
      </div>

    </a>


    <a
      class="game-card"
      href="https://www.xbox.com/"
      target="_blank"
      rel="noopener noreferrer">

      <div class="icon">🎮</div>

      <div class="game-name">
        Xbox
      </div>

    </a>


    <a
      class="game-card"
      href="https://shellshock.io/"
      target="_blank"
      rel="noopener noreferrer">

      <div class="icon">💥</div>

      <div class="game-name">
        Shell Shockers
      </div>

    </a>


    <!-- NEON SPACE -->

    <button
      class="game-card"
      onclick="openNeonSpace()">

      <div class="icon">
        🚀
      </div>

      <div class="game-name">
        Neon Space
      </div>

    </button>

  </div>

</section>


<!-- NEON SPACE -->

<section id="neonSpace">

  <div class="neon-box">

    <div class="neon-header">

      <h1 class="neon-title">
        🚀 NEON SPACE
      </h1>

      <div class="stats">

        <div class="stat">
          ⭐ <span id="score">0</span>
        </div>

        <div class="stat">
          ❤️ <span id="lives">3</span>
        </div>

      </div>

    </div>


    <div class="canvas-wrapper">

      <canvas id="gameCanvas"></canvas>


      <!-- GAME OVER -->

      <div
        id="gameOver"
        class="game-over">

        <h2>
          GAME OVER
        </h2>

        <p>
          Score: <span id="finalScore">0</span>
        </p>

        <button
          class="restart"
          onclick="restartGame()">

          🔄 Play Again

        </button>

      </div>

    </div>


    <div class="controls">
      🔴 Undvik de röda cirklarna &nbsp; • &nbsp;
      ⭐ Samla stjärnorna &nbsp; • &nbsp;
      ← → eller A / D
    </div>


    <button
      class="back-button"
      onclick="closeNeonSpace()">

      ← Back to Games

    </button>

  </div>

</section>

</div>


<script>

/* =================================
   SIDOR
================================= */

function showHome() {

  document.getElementById("welcome").style.display = "block";

  document.getElementById("gamePage").style.display = "none";

  document.getElementById("neonSpace").style.display = "none";

  document.getElementById("homeButton").classList.add("active");

  document.getElementById("gameButton").classList.remove("active");

  stopGame();
}


function showGames() {

  document.getElementById("welcome").style.display = "none";

  document.getElementById("gamePage").style.display = "block";

  document.getElementById("neonSpace").style.display = "none";

  document.getElementById("homeButton").classList.remove("active");

  document.getElementById("gameButton").classList.add("active");

  stopGame();
}


/* =================================
   NEON SPACE
================================= */

function openNeonSpace() {

  document.getElementById("welcome").style.display = "none";

  document.getElementById("gamePage").style.display = "none";

  document.getElementById("neonSpace").style.display = "block";

  document.getElementById("homeButton").classList.remove("active");

  document.getElementById("gameButton").classList.add("active");

  startGame();
}


function closeNeonSpace() {

  stopGame();

  document.getElementById("neonSpace").style.display = "none";

  document.getElementById("gamePage").style.display = "block";
}


/* =================================
   SPELET
================================= */

const canvas =
  document.getElementById("gameCanvas");

const ctx =
  canvas.getContext("2d");

let player;

let enemies = [];

let stars = [];

let score = 0;

let lives = 3;

let keys = {};

let gameRunning = false;

let animationFrame;


/* =================================
   CANVAS
================================= */

function resizeCanvas() {

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    rect.width * dpr;

  canvas.height =
    rect.height * dpr;

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}


/* =================================
   SPELARE
================================= */

function resetPlayer() {

  player = {

    x: canvas.clientWidth / 2,

    y: canvas.clientHeight - 65,

    width: 42,

    speed: 7

  };
}


/* =================================
   FIENDE
================================= */

function createEnemy() {

  enemies.push({

    x:
      25 +
      Math.random() *
      (canvas.clientWidth - 50),

    y: -30,

    radius:
      14 +
      Math.random() * 10,

    speed:
      2.5 +
      Math.random() * 2.5

  });
}


/* =================================
   STJÄRNA
================================= */

function createStar() {

  stars.push({

    x:
      20 +
      Math.random() *
      (canvas.clientWidth - 40),

    y: -20,

    radius: 7,

    speed:
      2 +
      Math.random() * 2

  });
}


/* =================================
   TANGENTER
================================= */

document.addEventListener(
  "keydown",
  function(e) {

    keys[e.key.toLowerCase()] = true;

  }
);

document.addEventListener(
  "keyup",
  function(e) {

    keys[e.key.toLowerCase()] = false;

  }
);


/* =================================
   UPPDATERA
================================= */

function updateGame() {

  if (!gameRunning) return;


  /* Rörelse */

  if (
    keys["arrowleft"] ||
    keys["a"]
  ) {

    player.x -= player.speed;

  }


  if (
    keys["arrowright"] ||
    keys["d"]
  ) {

    player.x += player.speed;

  }


  /* Begränsa */

  player.x =
    Math.max(
      player.width / 2,
      Math.min(
        canvas.clientWidth -
        player.width / 2,
        player.x
      )
    );


  /* =========================
     FIENDER
  ========================= */

  for (
    let i = enemies.length - 1;
    i >= 0;
    i--
  ) {

    const enemy =
      enemies[i];

    enemy.y += enemy.speed;


    /* Kollision */

    const dx =
      enemy.x - player.x;

    const dy =
      enemy.y - player.y;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );


    if (
      distance <
      enemy.radius + 20
    ) {

      lives--;

      document.getElementById(
        "lives"
      ).textContent = lives;

      enemies.splice(i,1);


      if (lives <= 0) {

        endGame();

        return;

      }

      continue;

    }


    /* Försvunnen */

    if (
      enemy.y >
      canvas.clientHeight + 40
    ) {

      enemies.splice(i,1);

    }

  }


  /* =========================
     STJÄRNOR
  ========================= */

  for (
    let i = stars.length - 1;
    i >= 0;
    i--
  ) {

    const star =
      stars[i];

    star.y += star.speed;


    const dx =
      star.x - player.x;

    const dy =
      star.y - player.y;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );


    if (distance < 28) {

      score += 10;

      document.getElementById(
        "score"
      ).textContent = score;

      stars.splice(i,1);

      continue;

    }


    if (
      star.y >
      canvas.clientHeight + 30
    ) {

      stars.splice(i,1);

    }

  }


  /* Nya fiender */

  if (
    Math.random() < .025
  ) {

    createEnemy();

  }


  /* Nya stjärnor */

  if (
    Math.random() < .035
  ) {

    createStar();

  }

}


/* =================================
   RITA
================================= */

function drawGame() {

  const w =
    canvas.clientWidth;

  const h =
    canvas.clientHeight;


  /* Bakgrund */

  ctx.fillStyle =
    "#030000";

  ctx.fillRect(
    0,
    0,
    w,
    h
  );


  /* Bakgrundsstjärnor */

  for (
    let i = 0;
    i < 100;
    i++
  ) {

    const x =
      (i * 83) % w;

    const y =
      (i * 47) % h;

    ctx.fillStyle =
      "rgba(255,100,100,.45)";

    ctx.fillRect(
      x,
      y,
      2,
      2
    );

  }


  /* =========================
     RÖDA FIENDER
  ========================= */

  for (
    const enemy of enemies
  ) {

    ctx.save();

    ctx.shadowBlur = 25;

    ctx.shadowColor = "#ff0000";

    ctx.fillStyle = "#ff1010";

    ctx.beginPath();

    ctx.arc(
      enemy.x,
      enemy.y,
      enemy.radius,
      0,
      Math.PI * 2
    );

    ctx.fill();


    /* Innercirkel */

    ctx.shadowBlur = 0;

    ctx.fillStyle =
      "rgba(120,0,0,.8)";

    ctx.beginPath();

    ctx.arc(
      enemy.x,
      enemy.y,
      enemy.radius * .45,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.restore();

  }


  /* =========================
     STJÄRNOR
  ========================= */

  for (
    const star of stars
  ) {

    ctx.save();

    ctx.translate(
      star.x,
      star.y
    );

    ctx.shadowBlur = 20;

    ctx.shadowColor = "#ffffff";

    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.moveTo(
      0,
      -star.radius
    );

    ctx.lineTo(
      star.radius * .35,
      -star.radius * .35
    );

    ctx.lineTo(
      star.radius,
      0
    );

    ctx.lineTo(
      star.radius * .35,
      star.radius * .35
    );

    ctx.lineTo(
      0,
      star.radius
    );

    ctx.lineTo(
      -star.radius * .35,
      star.radius * .35
    );

    ctx.lineTo(
      -star.radius,
      0
    );

    ctx.lineTo(
      -star.radius * .35,
      -star.radius * .35
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();

  }


  /* =========================
     RYMD-SKEPP
  ========================= */

  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );


  /* Glow */

  ctx.shadowBlur = 25;

  ctx.shadowColor = "#ff2020";


  /* Eld */

  ctx.fillStyle =
    "#ff7200";

  ctx.beginPath();

  ctx.moveTo(-8,17);

  ctx.lineTo(0,35);

  ctx.lineTo(8,17);

  ctx.closePath();

  ctx.fill();


  /* Skepp */

  ctx.fillStyle =
    "#ff3030";

  ctx.beginPath();

  ctx.moveTo(
    0,
    -25
  );

  ctx.lineTo(
    21,
    20
  );

  ctx.lineTo(
    0,
    12
  );

  ctx.lineTo(
    -21,
    20
  );

  ctx.closePath();

  ctx.fill();


  /* Fönster */

  ctx.shadowBlur = 10;

  ctx.shadowColor = "white";

  ctx.fillStyle =
    "white";

  ctx.beginPath();

  ctx.arc(
    0,
    -8,
    6,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();

}


/* =================================
   GAME LOOP
================================= */

function gameLoop() {

  if (!gameRunning) return;

  updateGame();

  drawGame();

  animationFrame =
    requestAnimationFrame(
      gameLoop
    );

}


/* =================================
   START
================================= */

function startGame() {

  resizeCanvas();

  resetPlayer();

  enemies = [];

  stars = [];

  score = 0;

  lives = 3;

  document.getElementById(
    "score"
  ).textContent = "0";

  document.getElementById(
    "lives"
  ).textContent = "3";

  document.getElementById(
    "gameOver"
  ).classList.remove("show");

  gameRunning = true;

  cancelAnimationFrame(
    animationFrame
  );

  gameLoop();

}


/* =================================
   GAME OVER
================================= */

function endGame() {

  gameRunning = false;

  document.getElementById(
    "finalScore"
  ).textContent = score;

  document.getElementById(
    "gameOver"
  ).classList.add("show");

}


/* =================================
   STARTA OM
================================= */

function restartGame() {

  startGame();

}


/* =================================
   STOPPA
================================= */

function stopGame() {

  gameRunning = false;

  cancelAnimationFrame(
    animationFrame
  );

}


/* =================================
   RESIZE
================================= */

window.addEventListener(
  "resize",
  function() {

    if (gameRunning) {

      resizeCanvas();

      resetPlayer();

    }

  }
);

</script>

</body>
</html>





</style>
