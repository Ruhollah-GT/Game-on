serif; } /* ========================= GAME MENU ========================= */ .game-menu { position: relative; display: flex; flex-direction: column; align-items: center; } /* ========================= GAME BUTTON ========================= */ .game-button { position: relative; display: flex; align-items: center; gap: 16px; padding: 20px 32px; border: 2px solid #ff3030; border-radius: 18px; background: linear-gradient( 135deg, #4d0000, #e00000, #690000 ); background-size: 200% 200%; color: white; font-size: 24px; font-weight: bold; letter-spacing: 4px; cursor: pointer; box-shadow: 0 0 10px #ff2020, 0 0 35px rgba(255,0,0,.5), inset 0 0 20px rgba(255,255,255,.08); animation: buttonGlow 3s ease infinite; transition: .35s ease; } .game-button:hover { transform: scale(1.1) translateY(-5px); box-shadow: 0 0 15px #ff2020, 0 0 50px #ff0000, 0 0 90px rgba(255,0,0,.5); } .game-button:active { transform: scale(.95); } /* ========================= GAME LIST ========================= */ .games { margin-top: 22px; display: flex; flex-direction: column; gap: 13px; opacity: 0; transform: translateY(-25px) scale(.8); pointer-events: none; transition: opacity .4s ease, transform .4s cubic-bezier(.17,.67,.3,1.4); } .games.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; } /* ========================= GAME OPTION ========================= */ .game-option { position: relative; width: 290px; min-height: 70px; display: flex; align-items: center; gap: 14px; padding: 12px 15px; border: 1px solid rgba(255,70,70,.35); border-radius: 16px; background: linear-gradient( 135deg, rgba(55,0,0,.95), rgba(15,15,15,.95) ); color: white; cursor: pointer; box-shadow: 0 8px 25px rgba(0,0,0,.4), 0 0 15px rgba(255,0,0,.12); overflow: hidden; transition: .3s ease; } .game-option:hover { transform: translateX(10px) scale(1.04); border-color: #ff3030; box-shadow: 0 0 15px #ff2020, 0 0 35px rgba(255,0,0,.4); } /* ICON */ .game-icon { width: 45px; height: 45px; display: grid; place-items: center; border-radius: 12px; background: rgba(255,0,0,.15); font-size: 24px; transition: .3s; } .game-option:hover .game-icon { transform: rotate(-8deg) scale(1.15); } /* TEXT */ .game-option strong { display: block; font-size: 16px; } .game-option small { display: block; margin-top: 4px; color: #aaa; font-size: 12px; } /* ARROW */ .arrow { margin-left: auto; font-size: 22px; transition: .3s; } .game-option:hover .arrow { transform: translateX(7px); color: #ff3030; } /* ========================= GAME SCREEN ========================= */ .game-screen { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,.65); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); opacity: 0; visibility: hidden; transition: opacity .4s ease, visibility .4s ease; z-index: 1000; } .game-screen.active { opacity: 1; visibility: visible; } /* ========================= GAME WINDOW ========================= */ .game-window { width: min(900px, 92vw); height: min(650px, 85vh); border-radius: 25px; overflow: hidden; background: linear-gradient( 145deg, rgba(40,0,0,.95), rgba(10,10,10,.97) ); border: 1px solid rgba(255,255,255,.15); box-shadow: 0 30px 100px rgba(0,0,0,.8), 0 0 50px rgba(255,0,0,.2); transform: scale(.8) translateY(30px); transition: transform .5s cubic-bezier(.16,1,.3,1); } .game-screen.active .game-window { transform: scale(1) translateY(0); } /* ========================= HEADER ========================= */ .game-header { height: 62px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: rgba(255,255,255,.06); border-bottom: 1px solid rgba(255,255,255,.1); color: white; } .online-dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: #ff3030; box-shadow: 0 0 10px #ff3030; animation: pulse 1.5s infinite; } /* CLOSE */ .close-button { width: 38px; height: 38px; border: none; border-radius: 50%; background: rgba(255,255,255,.08); color: white; font-size: 25px; cursor: pointer; transition: .25s; } .close-button:hover { background: #e00000; transform: rotate(90deg); } /* ========================= GAME CONTENT ========================= */ .game-content { height: calc(100% - 62px); display: flex; justify-content: center; align-items: center; color: white; } .game-loading { text-align: center; } .game-loading h2 { margin-bottom: 5px; } .game-loading p { color: #888; } /* LOADER */ .loader { width: 45px; height: 45px; margin: auto auto 20px; border-radius: 50%; border: 3px solid rgba(255,255,255,.1); border-top-color: #ff3030; animation: spin .8s linear infinite; } /* YOUR GAME */ .your-game { display: none; text-align: center; } .your-game h1 { font-size: 40px; text-shadow: 0 0 20px #ff3030; } .your-game p { color: #999; } /* BACK */ .back-button { margin-top: 20px; padding: 12px 25px; border: 1px solid #ff3030; border-radius: 12px; background: rgba(255,0,0,.15); color: white; cursor: pointer; transition: .3s; } .back-button:hover { background: #d00000; transform: scale(1.05); } /* ========================= PARTICLES ========================= */ .particles { position: absolute; inset: -180px; pointer-events: none; overflow: hidden; } .particles i { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #ff3030; box-shadow: 0 0 8px #ff3030, 0 0 18px #ff0000; opacity: .7; animation: float 5s infinite ease-in-out; } .particles i:nth-child(1) { left: 15%; top: 80%; } .particles i:nth-child(2) { left: 80%; top: 70%; width: 12px; height: 12px; animation-delay: .7s; } .particles i:nth-child(3) { left: 30%; top: 20%; animation-delay: 1.2s; } .particles i:nth-child(4) { left: 70%; top: 25%; animation-delay: 1.8s; } .particles i:nth-child(5) { left: 50%; top: 90%; width: 10px; height: 10px; animation-delay: 2.3s; } .particles i:nth-child(6) { left: 90%; top: 45%; animation-delay: 2.8s; } /* ========================= ANIMATIONS ========================= */ @keyframes float { 0%,100% { transform: translateY(0) scale(1); opacity: .3; } 50% { transform: translateY(-45px) scale(1.4); opacity: 1; } } @keyframes buttonGlow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } } @keyframes spin { to { transform: rotate(360deg); } } @keyframes pulse { 50% { opacity: .3; transform: scale(.7); } } </style> <script> function toggleGames() { document .getElementById("games") .classList.toggle("show"); } /* ÖPPNA SPEL */ function openGame(name) { const screen = document.getElementById("gameScreen"); const title = document.getElementById("gameTitle"); const loadingTitle = document.getElementById("loadingTitle"); const insideTitle = document.getElementById("insideTitle"); const loading = document.getElementById("gameLoading"); const game = document.getElementById("yourGame"); title.textContent = name; loadingTitle.textContent = "Loading " + name + "..."; insideTitle.textContent = "🎮 " + name; screen.classList.add("active"); /* Simulerar en kort laddningsanimation. Här kan du sedan lägga in ditt riktiga spel. */ loading.style.display = "block"; game.style.display = "none"; setTimeout(() => { loading.style.display = "none"; game.style.display = "block"; }, 900); } /* STÄNG SPEL */ function closeGame() { document .getElementById("gameScreen") .classList.remove("active"); } </script>

.glow-on-hover {
    width: 220px;
    height: 50px;
    border: none;
    outline: none;
    color: #fff;
    background: #111;
    cursor: pointer;
    position: relative;
    z-index: 0;
    border-radius: 10px;
}

.glow-on-hover:before {
    content: '';
    background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
    position: absolute;
    top: -2px;
    left:-2px;
    background-size: 400%;
    z-index: -1;
    filter: blur(5px);
    width: calc(100% + 4px);
    height: calc(100% + 4px);
    animation: glowing 20s linear infinite;
    opacity: 0;
    transition: opacity .3s ease-in-out;
    border-radius: 10px;
}

.glow-on-hover:active {
    color: #000
}

.glow-on-hover:active:after {
    background: transparent;
}

.glow-on-hover:hover:before {
    opacity: 1;
}

.glow-on-hover:after {
    z-index: -1;
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: #111;
    left: 0;
    top: 0;
    border-radius: 10px;
}

@keyframes glowing {
    0% { background-position: 0 0; }
    50% { background-position: 400% 0; }
    100% { background-position: 0 0; }
}
